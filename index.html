<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    </head>
<body>
    <div id="homeScreen" class="screen" style="display:flex;">
        <h1>QR Scanner</h1>
        <p>Click the button below to start scanning QR codes.</p>
        <button onclick="startCamera()">Start Camera</button>
    </div>

    <div id="scannerScreen" class="screen">
        <button class="top-back-btn" onclick="goHome()">← Back</button>
        <div id="reader"></div>
    </div>

    <div id="resultScreen" class="screen">
        <div id="resultBox">
            <h2>Scanned Result</h2>
            <div id="result"></div>
            <button onclick="goHome()">Back to Home</button>
        </div>
    </div>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
<script src="script.js"></script>
</body>
</html>
